services:
  - type: web
    name: ai-marketing-engine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-marketing-engine-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: ai-marketing-engine-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: ai-marketing-engine-db
    databaseName: marketing_engine
    user: marketing_engine
